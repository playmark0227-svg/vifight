    function frame(now) {
      var t = (now - t0) / dur; dx.clearRect(0, 0, dc.width, dc.height);
      for (var i = 0; i < ps.length; i++) {
        var p = ps[i], k = Math.min(1, Math.max(0, (t - p.d * .5) / .7)), e = 1 - Math.pow(1 - k, 3);
        dx.globalAlpha = t > 1.15 ? Math.max(0, 1 - (t - 1.15) / .35) : 1;
        dx.fillStyle = p.c; dx.beginPath();
        dx.arc((p.sx + (p.tx - p.sx) * e) * dpr, (p.sy + (p.ty - p.sy) * e) * dpr, rad, 0, 6.283); dx.fill();
      }
      if (t > 1.05 && !cc.classList.contains('done')) cc.classList.add('done');
      if (t < 1.5) raf = requestAnimationFrame(frame); else dx.clearRect(0, 0, dc.width, dc.height);
    }
    raf = requestAnimationFrame(frame);
  }

  function play() {
    clear();
    cc.className = 'hero-title hero-title--jp cc p' + cur;
    var w = document.getElementById('hkw');
    w.innerHTML = cur === 'D' ? '<span class="ch">北</span><span class="ch">海</span><span class="ch">道</span>' : '北海道';
    void cc.offsetWidth;
    cc.classList.add('run');
    if (cur === 'A') later(function () { var c = hkCenter(); map() && map().pulseFrom(c[0], c[1]); }, 700);
    if (cur === 'B') later(gather, 150);
    if (cur === 'D') later(function () { map() && map().sweep(); }, 1100);
  }
  document.querySelectorAll('[data-p]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x === b); });
      cur = b.dataset.p; play();
    });
  });
  document.getElementById('replay').addEventListener('click', play);
  var q = (location.hash || '').replace('#', '').toUpperCase();
  if (/^[ABCD]$/.test(q)) { cur = q; document.querySelectorAll('[data-p]').forEach(function (x) { x.classList.toggle('on', x.dataset.p === q); }); }
  window.addEventListener('load', function () { setTimeout(play, 900); });
})();
</script>
</body>
</html>
